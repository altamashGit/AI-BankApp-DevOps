# ============================================================
# GATE 3: CODE QUALITY (Checkstyle)
# ============================================================
name: Code Security Analysis
on:
  push:
    branches: [ docker , main ]
  workflow_run:
    workflows: ["Code-quality"]
    types:
      - completed

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  code-security-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
         distribution: 'temurin'
         java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build
        run: mvn clean install -DskipTests

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

# ============================================================
# GATE 4: Dependency-Check (OSAWP Dependency-Check)
# ============================================================
  
  depchecktest:
    runs-on: ubuntu-latest
    name: dependency-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
         distribution: 'temurin'
         java-version: '21'
      - name: Echo java home
        run: echo $JAVA_HOME

      # Added step to verify API key presence
      
      - name: Verify API Key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo " API key missing"
            exit 1
          else
            echo "API key present"
          fi

      - name: Build project with Maven
        run: mvn clean install -DskipTests

      - name: Cache Dependency Check DB
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Build project
        run: mvn -B -DskipTests package

      - name: Run OWASP Dependency Check
        env:          
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo ${{ secrets.NVD_API_KEY }}
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DautoUpdate=false
            -DnvdApiKey=$NVD_API_KEY \
            -DsuppressionFiles=dependency-check-suppressions.xml
            
      - name: Upload Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html