# ============================================================
# GATE 3: CODE QUALITY (Checkstyle)
# ============================================================
name: Code Security Analysis
on:
  push:
    branches: [ docker , main ]
  workflow_run:
    workflows: ["Code-quality"]
    types:
      - completed

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  code-security-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
         distribution: 'temurin'
         java-version: '21'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build
        run: mvn clean install -DskipTests

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v3

# ============================================================
# GATE 4: Dependency-Check (OSAWP Dependency-Check)
# ============================================================
  
  depchecktest:
    runs-on: ubuntu-latest
    name: dependency-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
         distribution: 'temurin'
         java-version: '21'
      - name: Echo java home
        run: echo $JAVA_HOME

      - name: Build project with Maven
        run: mvn clean install -DskipTests

      - name: Cache OWASP Dependency Check Data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}

      - name: Run OWASP Dependency Check
        run: |
         mvn org.owasp:dependency-check-maven:check \
           -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
           -Dformat=HTML \
           -DfailBuildOnCVSS=7 \
           -Ddependency-check.skipProvidedScope=true \
           -Ddependency-check.skipTestScope=true \
           -DnodeAnalyzerEnabled=false \
           -DnodeAuditAnalyzerEnabled=false \
           -DrubyBundlerAuditAnalyzerEnabled=false

      - name: Upload Dependency Report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
