name: Tests 
on:
    workflow_run:
        workflows:
          - code-quality
        types:
          - completed
jobs:
    tests:
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            
            - name: Setup Java
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17' 
            
            - name: Building with Maven
              run: mvn clean install -DskipTests

            - name: Run Tests
              run: mvn test